<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 240" role="img" aria-labelledby="title desc">
  <title id="title">Support can help create a positive adolescent-development spiral</title>
  <desc id="desc">Exploration and learning risks are met with adult support and guided responsibility, building confidence and supported learning risks.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 10 5 0 10Z" fill="#245a63" />
    </marker>
  </defs>
  <rect width="720" height="240" rx="24" fill="#edf7f5" />
  <g fill="#fff" stroke="#245a63" stroke-width="3">
    <rect x="24" y="72" width="190" height="96" rx="18" />
    <rect x="265" y="72" width="190" height="96" rx="18" />
    <rect x="506" y="72" width="190" height="96" rx="18" />
  </g>
  <g fill="#173b45" font-family="system-ui, sans-serif" font-size="20" font-weight="600" text-anchor="middle">
    <text x="119" y="108"><tspan x="119">Explore and take</tspan><tspan x="119" dy="27">learning risks</tspan></text>
    <text x="360" y="108"><tspan x="360">Adult support and</tspan><tspan x="360" dy="27">guided responsibility</tspan></text>
    <text x="601" y="108"><tspan x="601">Confidence and</tspan><tspan x="601" dy="27">supported learning</tspan></text>
  </g>
  <path d="M218 120h39M459 120h39" fill="none" stroke="#245a63" stroke-width="5" marker-end="url(#arrow)" />
</svg>
